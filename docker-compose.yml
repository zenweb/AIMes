# AIMes V1 开发环境 - Docker Compose
# 启动: docker compose up -d
# 停止: docker compose down
# 重建 API: docker compose build api && docker compose up -d api
# 查看日志: docker compose logs -f

services:
  postgresql:
    image: postgres:16-alpine
    container_name: aimes-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: mes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 仅挂载 seed.sql 用于演示数据；schema 由 API 启动时 EF Migrations 自动应用（MigrateAsync）。
      # init.sql 已删除（与 EF Migrations 双轨易漂移，决定 EF Migrations 为唯一事实源）。
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aimes-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: aimes-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aimes-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aimes-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      # 开源/演示场景：开启 Swagger UI + 关闭 HTTPS 重定向（避免 docker compose 起来后浏览器 307 翻车）
      Aimes__EnableSwagger: "true"
      Aimes__DisableHttpsRedirect: "true"
      # ⚠️ JWT 签名密钥 — 仅用于本地评估！生产环境必须替换为强随机值（≥32 字节）。
      # 生成方式： openssl rand -base64 48
      Jwt__SigningKey: "DEMO-ONLY-DO-NOT-USE-IN-PRODUCTION-replace-with-openssl-rand-base64-48"
      ConnectionStrings__DefaultConnection: "Host=postgresql;Database=mes;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__RabbitMQ: "rabbitmq://rabbitmq"
      AI__VectorStore__Provider: "Qdrant"
      AI__VectorStore__Qdrant__Host: "qdrant"
      AI__VectorStore__Qdrant__Port: "6333"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  qdrantdata:
