name: Agent Evaluation

on:
  pull_request:
    branches: ["main", "dev", "develop", "V1"]
  push:
    branches: ["main", "dev", "develop", "V1"]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore
        run: dotnet restore src/backend/AIMes.slnx

      - name: Build
        run: dotnet build src/backend/AIMes.slnx --no-restore /p:SkipFrontendBuildCopy=true --nologo --verbosity quiet --property:WarningLevel=0 --consoleloggerparameters:ErrorsOnly

      - name: Unit Tests
        run: dotnet test src/tests/MES.Tests.Unit/MES.Tests.Unit.csproj --no-build /p:SkipFrontendBuildCopy=true --verbosity quiet

      - name: Evaluation Tests
        run: dotnet test src/tests/MES.Tests.Evaluation/MES.Tests.Evaluation.csproj --no-build /p:SkipFrontendBuildCopy=true --verbosity quiet

      - name: Agent Evaluation
        shell: pwsh
        run: pwsh src/tests/MES.Tests.Evaluation/eval.ps1

      - name: Check Evaluation Gate
        shell: pwsh
        run: |
          $results = Get-Content src/tests/MES.Tests.Evaluation/eval_results.json | ConvertFrom-Json
          if (-not $results.gate_pass) {
            Write-Error "Evaluation gate failed!"
            $results.agents.PSObject.Properties | ForEach-Object {
              $agent = $_.Name
              $metrics = $_.Value
              if (-not $metrics.pass) {
                Write-Error "  ${agent}: precision=$($metrics.precision) recall=$($metrics.recall) adoptability=$($metrics.adoptability) error=$($metrics.error)"
              }
            }
            exit 1
          }
          Write-Host "All agents passed evaluation gate!"
