name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('v1/**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Format Check
        run: dotnet format --verify-no-changes --no-restore

      - name: Unit Tests
        run: dotnet test src/tests/MES.Tests.Unit/MES.Tests.Unit.csproj --no-restore --configuration Release --logger "trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Integration Tests
        run: dotnet test src/tests/MES.Tests.Integration/MES.Tests.Integration.csproj --no-restore --configuration Release --logger "trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: v1/TestResults/

      - name: Code Coverage Report
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: v1/TestResults/**/coverage.cobertura.xml
          badge: true
          format: markdown
          output: both

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1/src/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('v1/src/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint -- --max-warnings 0

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: v1/src/frontend/dist/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: NuGet dependency audit
        run: |
          cd v1
          dotnet list package --vulnerable --include-transitive 2>&1 | tee ../dependency-audit.txt
          if grep -q "vulnerable" ../dependency-audit.txt; then echo "::warning::发现已知漏洞的依赖包"; fi

      - name: npm audit
        run: |
          cd v1/src/frontend
          npm audit --audit-level=high || true
