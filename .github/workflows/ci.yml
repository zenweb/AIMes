name: CI

on:
  push:
    branches: ["main", "dev", "develop", "V1"]
  pull_request:
    branches: ["main", "dev", "develop", "V1"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AIMES_TEST_POSTGRES_CONNECTION: Host=localhost;Database=aimes_ci_tests;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/backend/AIMes.slnx

      - name: Build
        run: dotnet build src/backend/MES.Api/MES.Api.csproj --no-restore --configuration Release

      - name: Open-source build
        run: dotnet build src/backend/AIMes.slnx --no-restore --configuration Release /p:AimesOpenSource=true /p:SkipFrontendBuildCopy=true

      - name: Open-source runtime tests
        run: dotnet test src/tests/MES.Tests.Unit/MES.Tests.Unit.csproj --no-restore --configuration Release /p:AimesOpenSource=true /p:SkipFrontendBuildCopy=true --filter "FullyQualifiedName~OpenSourceTraceValidatorTests"

      - name: Format Check
        run: dotnet format src/backend/AIMes.slnx --verify-no-changes --no-restore

      - name: Architecture Tests
        run: dotnet test src/tests/MES.ArchitectureTests/MES.ArchitectureTests.csproj --no-restore --configuration Release /p:SkipFrontendBuildCopy=true --logger "trx" --results-directory TestResults/Architecture

      - name: Unit Tests
        run: dotnet test src/tests/MES.Tests.Unit/MES.Tests.Unit.csproj --no-restore --configuration Release /p:SkipFrontendBuildCopy=true --logger "trx" --collect:"XPlat Code Coverage" --results-directory TestResults/Unit

      - name: Integration Tests
        run: dotnet test src/tests/MES.Tests.Integration/MES.Tests.Integration.csproj --no-restore --configuration Release /p:SkipFrontendBuildCopy=true --logger "trx" --collect:"XPlat Code Coverage" --results-directory TestResults/Integration

      - name: Coverage Threshold
        shell: pwsh
        run: pwsh scripts/check-cobertura-threshold.ps1 -CoverageGlob "TestResults/**/coverage.cobertura.xml" -LineThreshold 10 -BranchThreshold 20

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/

      - name: Code Coverage Report
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: TestResults/**/coverage.cobertura.xml
          badge: true
          format: markdown
          output: both

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Lint check
        run: npm run lint
        working-directory: src/frontend

      - name: Unit tests
        run: npm run test:unit
        working-directory: src/frontend

      - name: Unit coverage
        run: npm run test:unit:coverage
        working-directory: src/frontend

      - name: Build
        run: npm run build:static
        working-directory: src/frontend

      - name: Verify deployable frontend entrypoint
        shell: pwsh
        run: |
          if (-not (Test-Path "src/frontend/.output/public/index.html")) {
            throw "Static frontend build is missing index.html"
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: src/frontend/.output/public/
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build --pull=false -t aimes:ci .

  recovery:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Release evidence contract tests
        shell: pwsh
        run: |
          pwsh scripts/test-postgresql-backup-restore.ps1
          pwsh scripts/test-gray-health-observation.ps1
          pwsh scripts/test-gray-incident-evidence-import.ps1
          pwsh scripts/test-gray-observation-workflow.ps1
          pwsh scripts/test-release-recovery-ci.ps1
          pwsh scripts/test-release-gate-backup-restore-contract.ps1

      - name: Start PostgreSQL and apply migrations
        run: |
          docker compose up -d --wait postgresql
          docker compose build migrator
          docker compose run --rm migrator

      - name: PostgreSQL backup and isolated restore
        shell: pwsh
        run: pwsh scripts/run-postgresql-backup-restore.ps1 -ReportPath TestResults/Recovery/postgresql-backup-restore.md

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-backup-restore
          path: TestResults/Recovery/postgresql-backup-restore.md

      - name: Cleanup recovery environment
        if: always()
        run: docker compose down -v

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: NuGet dependency audit
        shell: pwsh
        run: |
          dotnet restore src/backend/MES.Api/MES.Api.csproj
          $auditOutput = dotnet list src/backend/MES.Api/MES.Api.csproj package --vulnerable --include-transitive --no-restore
          $auditOutput | Out-File -FilePath dependency-audit.txt -Encoding utf8
          $auditOutput
          if ($auditOutput -match 'has the following vulnerable packages') {
            throw 'NuGet dependency audit found vulnerable packages.'
          }

      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: src/frontend
